<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<div th:insert="~{header}"></div>
</head>
<body>
<div class="container">
<form th:action="@{/signup}" method="post">
    <h1 class="mb-0 fw-bold text-dark">회원 가입</h1><br>
    <div class="mb-3">
        <label for="username" class="form-label">아이디</label><br>
        <input type="text" id="username" name="username" placeholder="ID"/>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">비밀번호</label><br>
        <input type="password" id="password" name="password" placeholder="Password"/>
    </div>
    <div th:if="${param.error}">
        이미 사용 중인 아이디입니다.</div><br>
    <button type="submit" class="btn btn-primary">회원 가입</button>
    <a href="/login"><button type="button" class="btn btn-warning">뒤로 가기</button></a>
</form>
    </div>
</body>
<link rel="stylesheet" th:href="@{/css/container.css}">
</html>
