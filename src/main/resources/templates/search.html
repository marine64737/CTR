<!DOCTYPE HTML>
<html xmlns:th="https://www.thymeleaf.org">
<div th:insert="~{header}"></div>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
<div class="container-xl">
<form action="#" th:action="@{/searchcomplete}" method="get">
    <h1 class="mb-0 fw-bold text-dark">문제 검색</h1><br>
    <div class="mb-3">
    <p>검색: <input type="text" name="word" th:value="${word}"/></p>
        <p>문제 번호의 일부 혹은 제목의 일부를 적어주세요.</p>
    <button type="submit" class="btn btn-primary">검색</button>
        <a href="/"><button type="button" class="btn btn-warning">뒤로 가기</button></a><br>
</form>
    <table class="table border-dark">
        <thead>
        <tr>
            <th class="col-1 text-center p-2">No.</th>
            <th class="col-9 text-center p-2">제목</th>
            <th class="col-1 text-center p-2"></th>
        </tr>
        </thead>
        <tbody class="table-group-divider">
        <tr th:each="question: ${questions}">
            <form action="#" th:action="@{/added}" method="post">
                <input type="hidden" name="id" th:value="${question.id}"/>
                <td class="col-1 text-center p-2 align-middle" th:text="${question.id}">ID</td>
                <td class="col-9 p-2 align-middle" th:text="${question.title}">Title</td>
                <td class="col-1 p-2"><button type="submit" class="btn btn-primary">추가</button></td>
            </form>
        </tr>
        </tbody>
    </table>
</div>
</body>
<link rel="stylesheet" th:href="@{/css/container.css}">
</html>
