<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<div th:insert="~{header}"></div>
</head>
<body>
<div class="container-xl">

    <a href="/ctr/search"><button type="button" class="btn btn-primary">문제 추가</button></a>
    <div class="row">
        <div class="col-6">
            <br><h2 class="mb-0 fw-bold text-dark" th:text="'풀이 이력 '+'/ 문제 수: '+${count}"></h2>
<!--            <p class="mb-0 fw-bold text-dark">풀이 완료 시 티어 공개</p>-->

            <table class="table border-dark" th:if="${my.size() != 0}">
    <thead>
    <tr>
        <th class="col-1 text-center p-2">No.</th>
        <th class="col-1 text-center p-2">Tier</th>
        <th class="col-9 text-center p-2">제목</th>
        <th class="col-3 text-center p-2">풀이 현황</th>
    </tr>
    </thead>
    <tbody class="table-group-divider">
    <tr th:each="problem: ${my}">
        <th class="text-center p-2"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link" th:text="${problem.pid}">problemid</button></a></th>
        <div th:if="${problem.status}==2" th:switch="${problem.level}">
            <td class="text-center p-2" th:case="0"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">No Rate</button></a></td>
            <td class="text-center p-2" th:case="1"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">B5</button></a></td>
            <td class="text-center p-2" th:case="2"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">B4</button></a></td>
            <td class="text-center p-2" th:case="3"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">B3</button></a></td>
            <td class="text-center p-2" th:case="4"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">B2</button></a></td>
            <td class="text-center p-2" th:case="5"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">B1</button></a></td>
            <td class="text-center p-2" th:case="6"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">S5</button></a></td>
            <td class="text-center p-2" th:case="7"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">S4</button></a></td>
            <td class="text-center p-2" th:case="8"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">S3</button></a></td>
            <td class="text-center p-2" th:case="9"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">S2</button></a></td>
            <td class="text-center p-2" th:case="10"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">S1</button></a></td>
            <td class="text-center p-2" th:case="11"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">G5</button></a></td>
            <td class="text-center p-2" th:case="12"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">G4</button></a></td>
            <td class="text-center p-2" th:case="13"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">G3</button></a></td>
            <td class="text-center p-2" th:case="14"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">G2</button></a></td>
            <td class="text-center p-2" th:case="15"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">G1</button></a></td>
            <td class="text-center p-2" th:case="16"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">P5</button></a></td>
            <td class="text-center p-2" th:case="17"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">P4</button></a></td>
            <td class="text-center p-2" th:case="18"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">P3</button></a></td>
            <td class="text-center p-2" th:case="19"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">P2</button></a></td>
            <td class="text-center p-2" th:case="20"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">P1</button></a></td>
            <td class="text-center p-2" th:case="21"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">D5</button></a></td>
            <td class="text-center p-2" th:case="22"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">D4</button></a></td>
            <td class="text-center p-2" th:case="23"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">D3</button></a></td>
            <td class="text-center p-2" th:case="24"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">D2</button></a></td>
            <td class="text-center p-2" th:case="25"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">D1</button></a></td>
            <td class="text-center p-2" th:case="26"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">R5</button></a></td>
            <td class="text-center p-2" th:case="27"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">R4</button></a></td>
            <td class="text-center p-2" th:case="28"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">R3</button></a></td>
            <td class="text-center p-2" th:case="29"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">R2</button></a></td>
            <td class="text-center p-2" th:case="30"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">R1</button></a></td>
        </div>
        <div th:unless="${problem.status}==2">
            <td class="text-center p-2" ><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link">-</button></a></td>
        </div>

        <td class="p-2"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link" th:text="${problem.title}">title</button></a></td>
        <div th:switch="${problem.status}">
            <td class="p-2 text-center align-middle" th:case="0"><a th:href="@{'/solve/'+${problem.pid}}"><span class="badge text-bg-primary fs-6">풀이 전</span></a></td>
            <td class="p-2 text-center align-middle" th:case="1"><a th:href="@{'/solve/'+${problem.pid}}"><span class="badge text-bg-secondary fs-6">풀이 중</span></a></td>
            <td class="p-2 text-center align-middle" th:case="2"><a th:href="@{'/solve/'+${problem.pid}}"><span class="badge text-bg-success fs-6">풀이 완료</span></a></td>
            <td class="p-2 text-center align-middle" th:case="3"><a th:href="@{'/solve/'+${problem.pid}}"><span class="badge text-bg-danger fs-6">미해결</span></a></td>
        </div>
        </a>
    </tr>
    </tbody>
</table>
            <p class="mb-0 fw-bold text-dark" th:unless="${my.size() != 0}"><br>풀이 이력이 존재하지 않습니다.<br></p>
        </div>
        <div class="col-6">
            <br><h2 class="mb-0 fw-bold text-dark">풀이 예정</h2>
            <table class="table border-dark" th:if="${my1.size() != 0}">
                <thead>
                <tr>
                    <th class="col-1 text-center p-2">No.</th>
                    <th class="col-6 text-center p-2">제목</th>
                    <th class="col-3 text-center p-2">풀이 현황</th>
<!--                    <th class="col-3 text-center p-2">숨기기</th>-->
                </tr>
                </thead>
                <tbody class="table-group-divider">
                <tr th:each="problem: ${my1}">
                    <th class="text-center p-2 align-middle" th:if="${problem.nonvisible == false}"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link" th:text="${problem.pid}">problemid</button></a></th>
                    <th class="text-center p-2 align-middle" th:if="${problem.nonvisible == true}" th:text="${problem.pid}">problemid</th>
                    <td class="p-2 align-middle" th:if="${problem.nonvisible == false}"><a th:href="@{'/solve/'+${problem.pid}}"><button type="button" class="btn btn-link" th:text="${problem.title}">title</button></a></td>
                    <td class="text-center p-2 align-middle" th:if="${problem.nonvisible == true}">-</td>
                    <div th:switch="${problem.status}">
                        <a th:href="@{'/solve/'+${problem.pid}}"><td class="p-2 text-center align-middle" th:if="${problem.nonvisible == false}" th:case="0"><a th:href="@{'/solve/'+${problem.pid}}"><span class="badge text-bg-primary fs-6">풀이 전</span></a></td></a>
                        <td class="p-2 text-center align-middle" th:if="${problem.nonvisible == true}">-</td>
                    </div>
<!--                    <td>-->
<!--                        <button class = "btn btn-success fs-8" type="button" th:onclick = "toggleStatus([[${problem.id}]])" th:text = "${problem.nonvisible == true}? 보이기 : 숨기기">-</button>-->
<!--                    </td>-->
                </tr>
                </tbody>
            </table>
            <p class="mb-0 fw-bold text-dark" th:unless="${my1.size() != 0}"><br>풀이 예정 문제가 존재하지 않습니다.<br></p>
        </div>
</div>
    <br>
    <a href="/ctr/search"><button type="button" class="btn btn-primary" th:if="${my.size() > 20}">문제 추가</button></a>
<!--    <p><a href="/list"><button type="button" class="btn btn-secondary" th:if="${currentUserName == 'tkdgh'}">전체 문제</button></a></p>-->
</div>
</body>
<div th:insert="~{footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="/js/system.js"></script>
</html>
