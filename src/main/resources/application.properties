spring.application.name=CTR
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/ctr?rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql: true
spring.security.user.name=Kim
spring.security.user.password=1234
server.servlet.session.timeout=1440m
# Session timeout. If a duration suffix is not specified, seconds is used.
spring.session.redis.flush-mode=on_save
# Sessions flush mode.
spring.session.redis.namespace=spring:session
# Namespace for keys used to store sessions.
spring.data.redis.host=localhost
# Redis server host.
pring.data.redis.password=1234
# Login password of the redis server.
spring.data.redis.port=6379
# Redis server port.